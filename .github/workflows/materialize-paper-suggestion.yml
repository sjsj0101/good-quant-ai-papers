name: Materialize approved paper suggestion

"on":
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: paper-suggestion-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      ${{ startsWith(github.event.issue.title, '[Paper suggestion]') &&
      github.event.label.name == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Authorize the label actor
        id: auth
        env:
          EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.contributions.cli authorize-event
          --event "$EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

      - name: Re-extract metadata from the original Issue
        id: inspect
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: >-
          python3 -m scripts.contributions.cli inspect-event
          --event "$EVENT_PATH"
          --catalog data/papers.yaml
          --result "$RUNNER_TEMP/result.json"
          --report "$RUNNER_TEMP/report.md"
          --labels "$RUNNER_TEMP/label.txt"

      - name: Append the partial catalog record
        id: materialize
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python3 -m scripts.contributions.cli materialize
          --result "$RUNNER_TEMP/result.json"
          --catalog data/papers.yaml
          --issue-number "$ISSUE_NUMBER"
          --pr-body "$RUNNER_TEMP/pr.md"
          --github-output "$GITHUB_OUTPUT"

      - name: Commit and push the Issue branch
        id: push
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        env:
          BRANCH: ${{ steps.materialize.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.yaml
          git commit -m "data: stage paper suggestion #$ISSUE_NUMBER"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Create or update the draft pull request
        id: pr
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        env:
          BRANCH: ${{ steps.materialize.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr.md"
            gh pr view "$existing" --json url --jq '.url'
          else
            gh pr create --draft --head "$BRANCH" --base main --title "Paper suggestion #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/pr.md"
          fi

      - name: Mark the Issue after a PR exists
        id: mark
        if: ${{ steps.auth.outputs.authorized == 'true' && steps.pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label pr-created

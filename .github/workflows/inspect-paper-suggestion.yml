name: Inspect paper suggestion

"on":
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-suggestion-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: ${{ startsWith(github.event.issue.title, '[Paper suggestion]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Extract metadata and check duplicates
        id: inspect
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: >-
          python3 -m scripts.contributions.cli inspect-event
          --event "$EVENT_PATH"
          --catalog data/papers.yaml
          --result "$RUNNER_TEMP/result.json"
          --report "$RUNNER_TEMP/report.md"
          --labels "$RUNNER_TEMP/label.txt"

      - name: Update managed Issue report and state
        id: sync
        if: ${{ always() && steps.inspect.outcome == 'success' }}
        env:
          EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.contributions.cli sync-issue
          --event "$EVENT_PATH"
          --report "$RUNNER_TEMP/report.md"
          --labels "$RUNNER_TEMP/label.txt"
